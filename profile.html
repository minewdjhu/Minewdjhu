<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile | Minewdjhu</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>
<main class="page">
  <div id="content">Loading…</div>
</main>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
const viewingUsername = qs("username");
const isOwn = !viewingUsername || viewingUsername === Auth.getUsername();

async function render() {
  const content = document.getElementById("content");
  if (!isOwn && !viewingUsername) { content.innerHTML = "<p>No profile specified.</p>"; return; }
  if (isOwn) Auth.requireLogin();

  let p;
  try {
    p = isOwn ? await Api.get("/api/profile/me") : await Api.get(`/api/profile/${viewingUsername}`);
  } catch (e) {
    content.innerHTML = `<div class="alert error">${esc(e.message)}</div>`;
    return;
  }

  content.innerHTML = `
    <h1>${esc(p.display_name || p.username)} ${p.is_admin ? '<span class="badge-pill admin-link" style="border-color:var(--warn); color:var(--warn);">staff</span>' : ''} ${p.is_risky_creator ? '<span class="badge-pill warn-risky">⚠ risky creator</span>' : ''}</h1>
    ${p.title ? `<p class="subtitle">"${esc(p.title)}"</p>` : ''}
    ${p.bot ? `<div class="card"><div class="card-row" style="margin:0;"><span><span class="bot-tag">🤖 bot</span> ${p.bot.tracked ? "A tracked bot character" : "An ambient market bot"}. Not a person, and not on the leaderboard.</span>
        <strong class="${p.bot.profit >= 0 ? "pct-up" : "pct-down"}">${p.bot.profit >= 0 ? "+" : ""}${money(p.bot.profit)} (${p.bot.profit_pct}%) profit</strong></div>
      ${p.bot.bio ? `<p class="subtitle" style="margin:.5rem 0 0;">${esc(p.bot.bio)}</p>` : ""}
      <p class="small-text" style="margin:.5rem 0 .2rem;">Proficiency <strong>${p.bot.skill}/10 ${esc(p.bot.skill_label)}</strong> &middot; ${esc(p.bot.style_desc)}</p>
      <div class="skill-bar"><i style="width:${p.bot.skill * 10}%"></i></div></div>` : ""}
    <div class="grid cols-4">
      <div class="stat-tile"><div class="label">Wallet</div><div class="value">${money(p.balance)}</div></div>
      <div class="stat-tile"><div class="label">Bank</div><div class="value">${money(p.bank_balance)}</div></div>
      <div class="stat-tile"><div class="label">Portfolio</div><div class="value">${money(p.portfolio_value)}</div></div>
      <div class="stat-tile"><div class="label">Net worth</div><div class="value">${money(p.balance + p.bank_balance + p.portfolio_value)}</div></div>
    </div>
    <div class="grid cols-2" style="margin-top:0.6rem;">
      <div class="stat-tile"><div class="label">Login streak</div><div class="value">${p.current_streak_days} days</div></div>
      <div class="stat-tile"><div class="label">Longest streak</div><div class="value">${p.longest_streak_days} days</div></div>
    </div>

    ${isOwn ? `<p class="subtitle" style="margin-top:1rem;"><a href="account.html">Account settings, Discord linking &amp; customization →</a></p>` : ""}

    <h2>Badges</h2>
    <div class="chip-row">
      ${p.badges.map(b => `<span class="badge-pill" title="${esc(b.description)}">${b.emoji} ${esc(b.name)}</span>`).join("") || "<span class='subtitle'>No badges yet.</span>"}
    </div>

    <h2>Holdings</h2>
    <table><thead><tr><th>Symbol</th><th>Shares</th><th>Avg cost</th><th>Price</th><th>Value</th><th>P/L</th></tr></thead>
      <tbody>
      ${p.holdings.map(h => `
        <tr><td class="symbol"><a href="market.html?symbol=${esc(h.symbol)}">${esc(h.symbol)}</a></td>
        <td>${h.shares.toFixed(4)}</td><td class="price">${money(h.avg_cost)}</td><td class="price">${money(h.price)}</td>
        <td class="price">${money(h.market_value)}</td>
        <td class="${h.unrealized_pl >= 0 ? 'pct-up' : 'pct-down'}">${money(h.unrealized_pl)}</td></tr>
      `).join("") || `<tr><td colspan="6">No holdings yet.</td></tr>`}
      </tbody></table>
    ${p.credit && p.credit.loans_taken ? `<p class="small-text" style="margin-top:1rem;">💳 Credit record: ${p.credit.loans_taken} loan(s), ${p.credit.paid_on_time} paid on time, ${p.credit.paid_late} late${p.credit.overdue_now ? `, <span class="pct-down">${p.credit.overdue_now} overdue now</span>` : ""}.</p>` : ""}
    <details class="why" id="history" style="margin-top:1.2rem;">
      <summary>📜 Trade history (latest purchases and sales)</summary>
      <div id="history-body" class="small-text" style="margin-top:.6rem;">Loading…</div>
    </details>
  `;
  let historyLoaded = false;
  document.getElementById("history").addEventListener("toggle", async (ev) => {
    if (!ev.target.open || historyLoaded) return;
    historyLoaded = true;
    const body = document.getElementById("history-body");
    try {
      const t = await Api.get(`/api/profile/${encodeURIComponent(p.username)}/history`);
      body.innerHTML = t.length ? `<table class="tight"><thead><tr><th>When</th><th></th><th>Shares</th><th>Market</th><th>Price</th><th>Total</th><th>Result</th></tr></thead><tbody>${t.map(x => `
        <tr><td>${new Date(x.ts + "Z").toLocaleString()}</td><td class="${x.side === "buy" ? "pct-up" : "pct-down"}">${esc(x.side)}</td><td>${x.shares}</td>
        <td><a href="market.html?symbol=${encodeURIComponent(x.symbol)}">${esc(x.symbol)}</a></td><td class="price">${money(x.price)}</td><td class="price">${money(x.total)}</td>
        <td>${x.side === "sell" && x.realized_pl !== null ? `<span class="${x.realized_pl >= 0 ? "pct-up" : "pct-down"}">${x.realized_pl >= 0 ? "+" : ""}${money(x.realized_pl)}</span>` : ""}</td></tr>`).join("")}</tbody></table>` : "No trades yet.";
    } catch (e) { body.textContent = "Couldn't load the history."; historyLoaded = false; }
  });
}
render();
</script>
</body>
</html>
