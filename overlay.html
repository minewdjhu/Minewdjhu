<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Minewdjhu overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: transparent; font-family: "Space Grotesk", sans-serif; color: #f1f5f9; overflow: hidden; }
  #wrap { position: fixed; inset: 0; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; transform-origin: top left; }
  .col { display: flex; flex-direction: column; gap: 12px; width: 380px; }
  .panel { background: rgba(10,15,31,.82); border: 1px solid rgba(148,163,184,.25); border-radius: 16px; padding: 12px 16px; backdrop-filter: blur(6px); }
  .panel h4 { margin: 0 0 6px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #94a3b8; }
  .row { display: flex; justify-content: space-between; gap: 10px; font-size: 16px; padding: 2px 0; } .mono { font-family: "JetBrains Mono", monospace; }
  .up { color: #34d399; } .down { color: #fb7185; } .live { color: #ef4444; } .small { font-size: 13px; color: #94a3b8; }
  .bar { height: 10px; background: rgba(148,163,184,.25); border-radius: 10px; overflow: hidden; margin-top: 6px; } .bar i { display: block; height: 100%; background: linear-gradient(90deg, #34d399, #38bdf8); }
  #ticker { background: rgba(10,15,31,.85); border: 1px solid rgba(148,163,184,.25); border-radius: 14px; padding: 10px 0; overflow: hidden; white-space: nowrap; }
  #ticker div { display: inline-block; padding-left: 100%; animation: scroll 40s linear infinite; font-size: 18px; } #ticker span { margin-right: 36px; }
  @keyframes scroll { to { transform: translateX(-100%); } } .tag { font-size: 11px; color: #7dd3fc; }
</style>
</head>
<body>
<div id="wrap"><div class="col" id="col"></div><div id="ticker"><div id="tick"></div></div></div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
// Add this page to OBS as a Browser source (size 1920 x 1080). Options go on the end of the address:
//   ?show=event,prediction,trades,leaderboard,purchases,ticker     (pick any, in any order)
//   &refresh=20   seconds between updates, 10 or more (default 20)     &scale=1.2   make everything bigger
const params = new URLSearchParams(location.search);
const show = (params.get("show") || "event,prediction,trades,leaderboard,purchases,ticker").split(",");
const refresh = Math.max(10, parseInt(params.get("refresh") || "20", 10)) * 1000;
const scale = parseFloat(params.get("scale") || "1");
if (scale !== 1) { const w = document.getElementById("wrap"); w.style.transform = `scale(${scale})`; w.style.width = `${100 / scale}%`; w.style.height = `${100 / scale}%`; }
if (!show.includes("ticker")) document.getElementById("ticker").style.display = "none";
const panel = (title, html) => `<div class="panel"><h4>${title}</h4>${html}</div>`;
async function tick() {
  try {
    const d = await Api.get("/api/overlay"), out = [];
    for (const part of show) {
      if (part === "event" && d.event) out.push(panel(`<span class="live">&#9679;</span> Live event`, `<div style="font-size:19px;font-weight:700;">${esc(d.event.title)}</div>
        ${d.event.progress_pct !== null ? `<div class="bar"><i style="width:${d.event.progress_pct}%"></i></div><div class="small">${d.event.progress_pct.toFixed(0)}% of the goal</div>` : `<div class="small">${esc(d.event.what_it_does || "")}</div>`}
        <div class="small">${d.event.ends_at ? timeLeft(d.event.ends_at) : ""}</div>`));
      if (part === "prediction" && d.prediction) out.push(panel("&#128302; Prediction", `<div style="font-weight:700;">${esc(d.prediction.title)}</div>` +
        d.prediction.options.map(o => `<div class="row"><span>${esc(o.label)}</span><span class="mono">${o.share_pct}%${o.multiplier ? ` &middot; x${o.multiplier}` : ""}</span></div>`).join("") +
        `<div class="small">Pool ${money(d.prediction.pool)} MWD &middot; ${d.prediction.players} player(s)</div>`));
      if (part === "trades" && d.trades.length) out.push(panel("Live trades", d.trades.map(t => `<div class="row"><span>${esc(t.username)} ${t.is_bot ? '<span class="tag">&#129302; bot</span>' : ""}</span><span class="${t.side === "buy" ? "up" : "down"} mono">${t.side} ${t.shares} ${esc(t.symbol)}</span></div>`).join("")));
      if (part === "leaderboard" && d.leaderboard.length) out.push(panel("Leaderboard", d.leaderboard.map(r => `<div class="row"><span>${r.rank}. ${esc(r.username)}</span><span class="mono">${money(r.net_worth)}</span></div>`).join("")));
      if (part === "purchases" && d.purchases.length) out.push(panel("Just redeemed", d.purchases.slice(0, 3).map(p => `<div class="row"><span>${esc(p.username)}</span><span class="small">${esc(p.item)}</span></div>`).join("")));
    }
    document.getElementById("col").innerHTML = out.join("");
    document.getElementById("tick").innerHTML = d.markets.map(m => `<span><strong>${esc(m.symbol)}</strong> <span class="mono">${money(m.price)}</span> <span class="${m.change_pct >= 0 ? "up" : "down"} mono">${m.change_pct >= 0 ? "▲" : "▼"} ${Math.abs(m.change_pct).toFixed(2)}%</span></span>`).join("");
  } catch (e) { /* keep showing the last good data */ }
}
tick(); setInterval(tick, refresh);
</script>
</body></html>
