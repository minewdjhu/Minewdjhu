<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Room | Audit log</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="nav"></div>
<main class="page" id="admin-shell"></main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/admin-nav.js"></script>
<script>
renderAdminShell("audit.html");
let page = 1;
async function load() {
  const content = document.getElementById("admin-content");
  try {
    const rows = await Api.get(`/api/admin/audit?page=${page}`);
    content.innerHTML = `
      <h2 style="margin-top:0;">Audit log</h2>
      <p class="subtitle">Every admin action, newest first. Nothing here is ever edited or deleted.</p>
      <table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Details</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td>${new Date(r.ts).toLocaleString()}</td><td>${esc(r.actor_label)}</td>
        <td>${r.action}${r.is_sandbox ? ' <span class="badge-pill">sandbox</span>' : ''}</td><td>${esc(r.details)}</td></tr>`).join("") || `<tr><td colspan="4">Nothing logged yet.</td></tr>`}
      </tbody></table>
      <div class="chip-row" style="margin-top:1rem;">
        ${page > 1 ? `<button class="btn secondary small" onclick="page--; load();">Newer</button>` : ""}
        ${rows.length === 50 ? `<button class="btn secondary small" onclick="page++; load();">Older</button>` : ""}
      </div>`;
  } catch (e) { content.innerHTML = `<div class="alert error">${esc(e.message)}</div>`; }
}
load();
</script>
</body>
</html>
