<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Room | Creator coins</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="nav"></div>
<main class="page" id="admin-shell"></main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/admin-nav.js"></script>
<script>
renderAdminShell("creatorcoins.html");
document.getElementById("admin-content").innerHTML = `
  <h2 style="margin-top:0;">Creator coins</h2>
  <p class="small-text">Everything here applies to <strong>creator-owned coins only</strong>. Community markets are never touched. Each coin has its own fee mode: <strong>Standard</strong> (the dynamic system below, capped at its normal limits) or <strong>Admin</strong> (values you choose for that one coin, with no hidden maximum).</p>
  <div id="error" class="alert error hidden"></div><div id="ok" class="alert success hidden"></div>
  <table class="tight"><thead><tr><th>Coin</th><th>Mode</th><th>Fee now</th><th>Daily cap</th><th>Paid today</th><th>Left</th><th>Health</th><th>Money in</th><th>Fees earned</th><th></th></tr></thead><tbody id="coins"></tbody></table>

  <div class="card" style="margin-top:1.4rem;"><h3 style="margin-top:0;">Standard system settings</h3>
    <p class="small-text">Used by every coin that is NOT in Admin mode. The standard defaults are a 2.5% minimum, 15% maximum and a 5,000 MWD daily ceiling.</p>
    <div id="settings"></div><div class="chip-row" style="margin-top:.8rem;"><button class="btn" onclick="saveSettings()">Save settings</button></div></div>

  <dialog id="ov-dlg" style="border:1px solid var(--border);border-radius:16px;background:var(--surface);color:var(--text);max-width:560px;width:92vw;">
    <h3 style="margin-top:0;" id="ov-title">Fee settings</h3>
    <p class="small-text" id="ov-now"></p>
    <label class="check"><input type="checkbox" id="ov-enabled"> <strong>Use admin-controlled fee settings for this coin</strong></label>
    <div class="form-grid" style="margin-top:.8rem;"><label>Fee % <span class="small-text">(leave empty to keep following the standard rate)</span><input type="number" id="ov-pct" min="0" max="99.9" step="0.1"></label>
      <label>Daily cap in MWD <span class="small-text">(leave empty to keep following the standard cap)</span><input type="number" id="ov-cap" min="0" step="1"></label></div>
    <p class="small-text">No hidden maximum: 90% and a 10,000 cap are fine if you really want them. Only impossible values are refused (negative, or 100%+). Switching this off returns the coin to the standard system and its normal limits. It never resets today's allowance or touches past records.</p>
    <div class="chip-row" style="margin-top:1rem;"><button class="btn" onclick="saveOverride()">Save</button><button class="btn secondary" onclick="document.getElementById('ov-dlg').close()">Cancel</button></div></dialog>
  <dialog id="lg-dlg" style="border:1px solid var(--border);border-radius:16px;background:var(--surface);color:var(--text);max-width:900px;width:96vw;">
    <h3 style="margin-top:0;" id="lg-title">Ledger</h3><div id="lg-body" style="max-height:60vh;overflow:auto;"></div>
    <div class="chip-row" style="margin-top:1rem;"><button class="btn secondary" onclick="document.getElementById('lg-dlg').close()">Close</button></div></dialog>`;
const $ = id => document.getElementById(id);
const say = m => { const o = $("ok"); o.textContent = m; o.classList.remove("hidden"); setTimeout(() => o.classList.add("hidden"), 5000); };
const FIELDS = [
  ["Fee rate", [["fee_min_pct", "Minimum fee %"], ["fee_mid_pct", "Middle fee % (at the middle score)"], ["fee_max_pct", "Maximum fee % (standard)"], ["fee_start_score", "New coins start at health score"], ["fee_score_low", "Score at or below this = minimum fee"], ["fee_score_mid", "Score for the middle fee"], ["fee_score_high", "Score for the maximum fee"]]],
  ["Health score", [["fee_w_price", "Weight: price vs launch"], ["fee_w_activity", "Weight: real investors and fresh money"], ["fee_w_retention", "Weight: keeping that money in"], ["fee_price_lo", "Price ratio worth 0 points"], ["fee_price_hi", "Price ratio worth full points"], ["fee_holders_target", "Real investors for full points"], ["fee_capital_target", "Fresh MWD still invested for full points"], ["fee_up_alpha", "Climb speed per hour (0-1)"], ["fee_down_alpha", "Fall speed per hour (0-1)"]]],
  ["Daily cap", [["cap_small", "Small / new coins (MWD per day)"], ["cap_mid", "Healthy, established coins"], ["cap_ceiling", "Standard ceiling"], ["cap_score_low", "Score where the cap starts growing"], ["cap_score_high", "Score for the top cap"], ["cap_capital_target", "Fresh MWD invested for the top cap"]]],
  ["Anti-abuse", [["bot_fee_share_pct", "Most of the daily cap that bot purchases may use (%)"], ["recycle_hours", "Hours that withdrawn money counts as 'recycled'"]]],
  ["Creator coins in general", [["starter_equity", "Free starter equity (once per player, locked)"], ["max_deposit", "Most a creator can add at launch or in one Add Equity"], ["detail_fee", "Fee to change a coin's name or description"]]]];
const FLAGS = [["block_rug_pulls", "Block withdrawals over a creator's share (instead of allowing and punishing them)"], ["bots_invest", "Bots may invest in creator coins"]];
let vals = {}, coins = [], cur = null;
function drawSettings() {
  $("settings").innerHTML = FIELDS.map(([t, rows]) => `<h4>${t}</h4><div class="form-grid">${rows.map(([k, l]) => `<label>${l}<input type="number" id="s-${k}" step="any" min="0" value="${vals[k]}"></label>`).join("")}</div>`).join("")
    + `<h4>Switches</h4>` + FLAGS.map(([k, l]) => `<label class="check"><input type="checkbox" id="s-${k}" ${vals[k] ? "checked" : ""}> ${l}</label>`).join("<br>");
}
async function saveSettings() {
  clearError($("error")); const out = {};
  FIELDS.forEach(([, rows]) => rows.forEach(([k]) => { out[k] = parseFloat($(`s-${k}`).value); })); FLAGS.forEach(([k]) => { out[k] = $(`s-${k}`).checked; });
  try { const r = await Api.post("/api/admin/creator-coins/settings", { values: out }); vals = r.values; say("Saved."); load(); } catch (e) { showError($("error"), e); }
}
function openOverride(sym) {
  cur = coins.find(c => c.symbol === sym);
  $("ov-title").textContent = `Fee settings: ${cur.symbol}`;
  $("ov-now").innerHTML = `Standard system right now: <strong>${cur.standard_rate_pct}%</strong> fee, <strong>${money(cur.standard_cap)}</strong> a day (health ${cur.score}/100).`;
  $("ov-enabled").checked = cur.mode === "admin"; $("ov-pct").value = cur.override_pct ?? ""; $("ov-cap").value = cur.override_cap ?? ""; $("ov-dlg").showModal();
}
async function saveOverride() {
  clearError($("error"));
  const pct = $("ov-pct").value === "" ? null : parseFloat($("ov-pct").value), cap = $("ov-cap").value === "" ? null : parseFloat($("ov-cap").value);
  try { await Api.post(`/api/admin/creator-coins/${cur.symbol}/fees`, { enabled: $("ov-enabled").checked, pct, cap }); $("ov-dlg").close(); say("Saved. It's in the audit log."); load(); } catch (e) { showError($("error"), e); }
}
async function openLedger(sym) {
  $("lg-title").textContent = `Accounting ledger: ${sym}`; $("lg-body").textContent = "Loading…"; $("lg-dlg").showModal();
  const rows = await Api.get(`/api/admin/creator-coins/${sym}/ledger?limit=150`);
  $("lg-body").innerHTML = `<table class="tight"><thead><tr><th>When</th><th>Who</th><th>Kind</th><th>Paid / amount</th><th>Fee</th><th>Went in</th><th>Recycled</th><th>Mode</th><th>Today after</th><th>Note</th></tr></thead><tbody>${rows.map(r => `<tr><td>${new Date(r.ts + "Z").toLocaleString()}</td><td>${esc(r.user || "")}${r.bot ? ' <span class="bot-tag">🤖</span>' : ""}</td><td>${esc(r.kind)}</td><td class="price">${money(r.gross)}</td><td>${r.fee ? `${money(r.fee)} (${r.fee_pct.toFixed(1)}%)` : "-"}</td><td>${money(r.invested)}</td><td>${r.recycled ? money(r.recycled) : "-"}</td><td>${r.mode}</td><td>${money(r.paid_today_after)}</td><td class="small-text">${esc(r.note)}</td></tr>`).join("")}</tbody></table>`;
}
async function load() {
  try {
    coins = await Api.get("/api/admin/creator-coins");
    $("coins").innerHTML = coins.map(c => `<tr><td><strong>${esc(c.symbol)}</strong><div class="small-text">by ${esc(c.creator || "?")}${c.rug_pulled ? ' <span class="pct-down">rug pulled</span>' : ""}${c.status !== "active" ? ` · ${c.status}` : ""}</div></td>
      <td><span class="badge-pill ${c.mode === "admin" ? "warn-risky" : ""}">${c.mode === "admin" ? "Admin" : "Standard"}</span>${c.mode === "admin" ? `<div class="small-text">${c.rate_overridden ? "fee set" : "fee: standard"} · ${c.cap_overridden ? "cap set" : "cap: standard"}</div>` : ""}</td>
      <td><strong>${c.rate_pct}%</strong>${c.mode === "admin" ? `<div class="small-text">standard would be ${c.standard_rate_pct}%</div>` : ""}</td><td>${money(c.cap)}${c.mode === "admin" ? `<div class="small-text">standard ${money(c.standard_cap)}</div>` : ""}</td>
      <td>${money(c.paid_today)}${c.bot_paid_today ? `<div class="small-text">🤖 ${money(c.bot_paid_today)}</div>` : ""}</td><td>${money(c.remaining)}</td><td>${c.score}</td>
      <td>${money(c.reserve)}<div class="small-text">${c.holders} real investors · fresh ${money(c.human_net_in)}</div></td><td>${money(c.fees_total)}</td>
      <td><div class="chip-row"><button class="btn small secondary" onclick="openOverride('${c.symbol}')">Fee settings</button><button class="btn small secondary" onclick="openLedger('${c.symbol}')">Ledger</button></div></td></tr>`).join("") || `<tr><td colspan="10">No creator coins yet.</td></tr>`;
    vals = (await Api.get("/api/admin/creator-coins/settings")).values; drawSettings();
  } catch (e) { showError($("error"), e); }
}
load();
</script></body></html>
