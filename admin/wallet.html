<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Room | Wallet & loans</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="nav"></div>
<main class="page" id="admin-shell"></main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/admin-nav.js"></script>
<script>
renderAdminShell("wallet.html");
document.getElementById("admin-content").innerHTML = `
  <h2 style="margin-top:0;">Wallet &amp; loans</h2>
  <div id="error" class="alert error hidden"></div><div id="ok" class="alert success hidden"></div>
  <div id="sum" class="grid cols-4"></div>

  <div class="card"><h3 style="margin-top:0;">Rules</h3>
    <p class="small-text">Everything below applies to all players. Money only ever moves between wallets, except the daily bonus (counted above) and the "set wallet" tool on the Players page.</p>
    <div id="settings"></div>
    <div class="chip-row" style="margin-top:.8rem;"><button class="btn" onclick="saveSettings()">Save rules</button></div></div>

  <h2>Loans</h2>
  <div class="trade-form"><select id="loan-filter" onchange="loadLoans()"><option value="active">Active</option><option value="offered">Offered (in escrow)</option><option value="paid">Paid</option><option value="forgiven">Forgiven</option><option value="all">All</option></select></div>
  <table class="tight"><thead><tr><th>#</th><th>Lender → Borrower</th><th>Amount</th><th>Interest</th><th>Owing</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody id="loans"></tbody></table>

  <h2>Recent transfers</h2>
  <p class="small-text" id="top-recv"></p>
  <table class="tight"><thead><tr><th>When</th><th>From</th><th>To</th><th>Amount</th><th>Note</th></tr></thead><tbody id="transfers"></tbody></table>`;
const $ = id => document.getElementById(id);
const say = m => { const o = $("ok"); o.textContent = m; o.classList.remove("hidden"); setTimeout(() => o.classList.add("hidden"), 5000); };
const FIELDS = [
  ["Sending money", [["transfer_enabled", "Players can send money", "flag"], ["transfer_min_amount", "Smallest amount", "n"], ["transfer_daily_send_cap", "Most a player can send per day", "n"], ["transfer_daily_receive_cap", "Most a player can receive per day", "n"], ["transfer_min_age_hours", "Account age needed to send or receive (hours)", "n"], ["transfer_fee_pct", "Transfer fee % (removed from the economy, 0 = none)", "n"]]],
  ["Daily bonus", [["daily_enabled", "Daily bonus on", "flag"], ["daily_amount", "Bonus amount", "n"], ["daily_wallet_ceiling", "Only for wallets at or under", "n"]]],
  ["Loans", [["loans_enabled", "Loans on", "flag"], ["loan_min_amount", "Smallest loan", "n"], ["loan_max_amount", "Largest loan", "n"], ["loan_max_interest_pct", "Highest interest % a lender can set", "n"], ["loan_min_days", "Shortest term (days)", "n"], ["loan_max_days", "Longest term (days)", "n"],
    ["loan_protected_floor", "Protected wallet: collection never takes a player below this", "n"], ["loan_max_borrowed", "Most loans one player can owe at once", "n"], ["loan_max_lent", "Most loans one player can have out", "n"], ["loan_max_total_debt", "Most total debt per player", "n"],
    ["loan_offer_hours", "Hours an offer stays open", "n"], ["loan_min_borrower_age_days", "Account age needed to borrow (days)", "n"]]]];
let vals = {};
function drawSettings() {
  $("settings").innerHTML = FIELDS.map(([title, rows]) => `<h4>${title}</h4><div class="form-grid">${rows.map(([k, label, t]) => t === "flag"
    ? `<label class="check"><input type="checkbox" id="f-${k}" ${vals[k] ? "checked" : ""}> ${label}</label>`
    : `<label>${label}<input type="number" id="f-${k}" step="any" min="0" value="${vals[k]}"></label>`).join("")}</div>`).join("");
}
async function saveSettings() {
  clearError($("error")); const out = {};
  FIELDS.forEach(([, rows]) => rows.forEach(([k, , t]) => { out[k] = t === "flag" ? $(`f-${k}`).checked : parseFloat($(`f-${k}`).value); }));
  try { const r = await Api.post("/api/admin/wallet/settings", { values: out }); vals = r.values; say("Rules saved."); } catch (e) { showError($("error"), e); }
}
async function loadLoans() {
  const rows = await Api.get(`/api/admin/wallet/loans?status=${$("loan-filter").value}`);
  $("loans").innerHTML = rows.map(l => `<tr><td>${l.id}</td><td>${esc(l.lender)} → <strong>${esc(l.borrower)}</strong></td><td class="price">${money(l.principal)}</td><td>${l.interest_pct}%</td><td class="price">${money(l.remaining)}</td>
    <td>${l.due_at ? new Date(l.due_at + "Z").toLocaleDateString() : "-"}</td><td>${l.overdue ? '<span class="pct-down">overdue</span>' : esc(l.status)}</td>
    <td>${l.status === "active" ? `<button class="btn small secondary" onclick="forgive(${l.id})">Forgive</button>` : ""}</td></tr>`).join("") || `<tr><td colspan="8">None.</td></tr>`;
}
async function forgive(id) {
  if (!confirm("Write off the rest of this loan? The borrower stops owing it, and the lender does NOT get the money.")) return;
  try { const r = await Api.post(`/api/admin/wallet/loans/${id}/forgive`); say(`Wrote off ${money(r.written_off)} MWD.`); load(); } catch (e) { showError($("error"), e); }
}
async function load() {
  try {
    const s = await Api.get("/api/admin/wallet/summary");
    $("sum").innerHTML = [["Loans active", s.loans_active, `${money(s.outstanding)} owed`], ["Overdue", s.overdue_count, `${money(s.overdue_amount)} overdue`], ["Offers in escrow", money(s.offers_escrow), "held for lenders"], ["Daily bonus issued (ever)", money(s.daily_bonus_issued_total), "the only MWD this system creates"], ["Transfers today", s.transfers_today, `${money(s.transfer_volume_today)} moved`]]
      .map(([l, v, sub]) => `<div class="stat-tile"><div class="label">${l}</div><div class="value">${v}</div><div class="small-text">${sub}</div></div>`).join("");
    vals = (await Api.get("/api/admin/wallet/settings")).values; drawSettings(); await loadLoans();
    const t = await Api.get("/api/admin/wallet/transfers");
    $("top-recv").textContent = t.top_receivers_today.length ? "Biggest receivers today: " + t.top_receivers_today.map(r => `${r.username} ${money(r.total)} from ${r.from_players} player(s)`).join(" · ") : "No transfers today.";
    $("transfers").innerHTML = t.transfers.map(x => `<tr><td>${new Date(x.ts + "Z").toLocaleString()}</td><td>${esc(x.from)}</td><td>${esc(x.to)}</td><td class="price">${money(x.amount)}</td><td class="small-text">${esc(x.note || "")}</td></tr>`).join("") || `<tr><td colspan="5">None yet.</td></tr>`;
  } catch (e) { showError($("error"), e); }
}
load();
</script></body></html>
