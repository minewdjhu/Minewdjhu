<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Room | Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="nav"></div>
<main class="page" id="admin-shell"></main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/admin-nav.js"></script>
<script>
renderAdminShell("dashboard.html");
async function load() {
  const content = document.getElementById("admin-content");
  try {
    const d = await Api.get("/api/admin/dashboard");
    content.innerHTML = `
      <div class="grid cols-4">
        <div class="stat-tile"><div class="label">Players</div><div class="value">${d.user_count}</div></div>
        <div class="stat-tile"><div class="label">Markets</div><div class="value">${d.market_count}</div></div>
        <div class="stat-tile"><div class="label">Creator markets</div><div class="value">${d.creator_market_count}</div></div>
        <div class="stat-tile"><div class="label">Wallet circulation</div><div class="value">${money(d.total_wallet_circulation)}</div></div>
      </div>
      <div class="grid cols-4" style="margin-top:0.6rem;">
        <div class="stat-tile"><div class="label">Active events</div><div class="value">${d.active_events}</div></div>
        <div class="stat-tile"><div class="label">Risky creators</div><div class="value">${d.risky_creators}</div></div>
        <div class="stat-tile"><div class="label">Open incidents</div><div class="value">${d.open_incidents}</div></div>
        <div class="stat-tile"><div class="label">Maintenance</div><div class="value" style="color:${d.maintenance_on ? 'var(--danger)' : 'var(--up)'};">${d.maintenance_on ? "ON" : "off"}</div></div>
      </div>
      <div class="grid cols-2" style="margin-top:0.6rem;">
        <div class="stat-tile"><div class="label">Players online now</div><div class="value">${d.online_now}</div></div>
        <div class="stat-tile"><div class="label">Current tick interval</div><div class="value">${d.current_tick_interval_minutes} min</div></div>
      </div>
      ${d.maintenance_on ? `<div class="alert error" style="margin-top:1rem;">Maintenance mode is ON, the economy won't advance. Turn it off from <a href="economy.html">Economy</a>.</div>` : ""}
    `;
  } catch (e) { content.innerHTML = `<div class="alert error">${esc(e.message)}</div>`; }
}
load();
</script>
</body>
</html>
