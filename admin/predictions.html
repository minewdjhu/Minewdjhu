<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Room | Predictions</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="nav"></div>
<main class="page" id="admin-shell"></main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/admin-nav.js"></script>
<script>
renderAdminShell("predictions.html");
document.getElementById("admin-content").innerHTML = `
  <h2 style="margin-top:0;">Predictions</h2>
  <div id="error" class="alert error hidden"></div><div id="ok" class="alert success hidden"></div>
  <div class="card"><h3 style="margin-top:0;">New prediction</h3>
    <div class="form-grid"><label style="grid-column:1/-1;">Question<input id="p-title" maxlength="160" placeholder="Will Jack beat the boss on the first try?"></label>
      <label style="grid-column:1/-1;">Details (optional)<input id="p-desc" maxlength="300"></label>
      <label style="grid-column:1/-1;">Answers, one per line (2 to 6)<textarea id="p-opts" rows="3" placeholder="Yes&#10;No"></textarea></label>
      <label>Betting closes in (minutes, empty = until you lock it)<input type="number" id="p-close" min="1" step="1"></label>
      <label>Smallest stake<input type="number" id="p-min" value="5" min="1"></label><label>Biggest stake per player<input type="number" id="p-max" value="1000" min="1"></label>
      <button class="btn" onclick="create()">Open it</button></div>
    <p class="small-text">Players stake MWD on one answer. When you settle it, <strong>the whole pool is shared between the winners</strong> by stake size. Nobody on the winning side? Everyone is refunded. Admins can't bet.</p></div>
  <div id="list"></div>`;
const $ = id => document.getElementById(id);
const say = m => { const o = $("ok"); o.textContent = m; o.classList.remove("hidden"); setTimeout(() => o.classList.add("hidden"), 5000); };
async function call(fn) { clearError($("error")); try { await fn(); await load(); } catch (e) { showError($("error"), e); } }
function create() {
  call(async () => { await Api.post("/api/admin/predictions/new", { title: $("p-title").value, description: $("p-desc").value, options: $("p-opts").value.split("\n"), closes_in_minutes: $("p-close").value ? +$("p-close").value : null, min_bet: +$("p-min").value, max_bet: +$("p-max").value });
    $("p-title").value = $("p-desc").value = $("p-opts").value = ""; say("Prediction is live and announced in Discord."); });
}
const act = (id, what, body) => call(() => Api.post(`/api/admin/predictions/${id}/${what}`, body));
function resolve(id, optId, label) { if (confirm(`Settle it as "${label}"? Winners are paid straight away.`)) act(id, "resolve", { option_id: optId }); }
function cancelP(id) { if (confirm("Cancel it and refund everyone's stake?")) act(id, "cancel"); }
async function load() {
  try {
    const rows = await Api.get("/api/admin/predictions");
    $("list").innerHTML = rows.map(p => `<div class="card"><div class="card-row" style="margin:0;"><h3 style="margin:0;">${esc(p.title)}</h3><span class="badge-pill">${p.status}</span></div>
      <p class="small-text">Pool ${money(p.pool)} MWD · ${p.players} player(s)${p.closes_at ? ` · closes ${new Date(p.closes_at + "Z").toLocaleString()}` : ""}</p>
      ${p.options.map(o => `<div class="opt-row"><div style="flex:1 1 180px;"><strong>${esc(o.label)}</strong>${p.winning_option_id === o.id ? " 🏆" : ""}<div class="small-text">${o.backers} backer(s) · ${money(o.pool)} MWD (${o.share_pct}%)</div></div>
        ${p.status === "open" || p.status === "locked" ? `<button class="btn small" onclick="resolve(${p.id}, ${o.id}, '${esc(o.label).replace(/'/g, "")}')">This won</button>` : ""}</div>`).join("")}
      <div class="chip-row" style="margin-top:.6rem;">${p.status === "open" ? `<button class="btn small secondary" onclick="act(${p.id}, 'lock')">Close betting</button>` : ""}${p.status === "locked" ? `<button class="btn small secondary" onclick="act(${p.id}, 'reopen')">Reopen betting</button>` : ""}
        ${p.status === "open" || p.status === "locked" ? `<button class="btn small danger" onclick="cancelP(${p.id})">Cancel and refund</button>` : ""}</div></div>`).join("") || "<p class='small-text'>No predictions yet.</p>";
  } catch (e) { showError($("error"), e); }
}
load();
</script></body></html>
