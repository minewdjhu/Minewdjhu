<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in | Minewdjhu</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>
<main class="page narrow">
  <h1>Log in</h1>
  <div id="error" class="alert error hidden"></div>
  <form class="stacked" id="login-form">
    <label>Username<input type="text" id="username" required autofocus></label>
    <label>6-digit PIN<input type="password" id="pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="subtitle">No account yet? <a href="register.html">Sign up</a>.</p>
</main>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errEl = document.getElementById("error");
  clearError(errEl);
  try {
    const data = await Api.post("/api/auth/login", {
      username: document.getElementById("username").value.trim(),
      pin: document.getElementById("pin").value.trim(),
    });
    Auth.setSession(data.token, data.username, data.is_admin);
    window.location.href = "index.html";
  } catch (err) { showError(errEl, err); }
});
</script>
</body>
</html>
